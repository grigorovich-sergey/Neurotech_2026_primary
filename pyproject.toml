[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurotech-2026-primary"
version = "0.1.0"
description = "Research infrastructure for the NeuroTech capstone"
requires-python = ">=3.10"
dependencies = [
    # Upper bound retained for the older GPU machine's PyTorch/CUDA environment.
    "numpy>=1.24,<2.3",
    "PyYAML>=6.0",
    "h5py>=3.8",
    "scipy>=1.11,<2",
    "opencv-python>=4.8",
    "supervision>=0.25,<0.31",
    "ultralytics>=8.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
guardian = ["idun-guardian-sdk==0.1.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
