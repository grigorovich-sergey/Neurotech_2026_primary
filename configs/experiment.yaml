output_root: runs

runtime:
  subject_id: null
  active_model: null

model_selection:
  source: cli
  csv:
    enabled: false
    schedule_path: configs/experiment_condition_schedule.csv
    sequence_id: null

session:
  id_prefix: experiment-session
  maximum_duration_seconds: 300.0

terminal:
  concise_decisions: true

recording:
  # Raw scene/gaze HDF5 is deliberately opt-in because it makes the current
  # live experiment FPS unmanageable. The CLI can enable it with --record-glasses.
  glasses_enabled: false
  eeg_enabled: true

processing:
  scene_queue_size: 1
  gaze_queue_size: 4096
  gaze_batch_size: 64
  idle_sleep_seconds: 0.005

feedback:
  # Provisional until scripts/check_feedback_key.py is run with the actual HUD
  # presenter on the experiment computer. Extended OpenCV key codes are backend-specific.
  key_code: 80
  stop_key_codes: [113, 27]

display:
  enabled: true
  window_name: NeuroTech experiment
  selection_banner_seconds: 1.0
  feedback_banner_seconds: 0.5
  no_frame_warning_seconds: 3.0

diagnostics:
  write_mindlink_metadata: true

analysis:
  enabled: true

controlled_intention:
  enabled: false
  protocol_path: null
  cue_display_seconds: null

subsystem_configs:
  mindlink:
    default: configs/mindlink.yaml
    override: null
  gaze_interaction:
    default: configs/gaze_interaction.yaml
    override: configs/practice_gaze.yaml
  eeg_pipeline:
    default: configs/eeg_pipeline.yaml
    override: configs/practice_eeg.yaml
  experiment_learning:
    default: configs/experiment_learning.yaml
    override: null
